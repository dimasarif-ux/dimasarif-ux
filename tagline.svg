<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 160" width="1200" height="160" role="img" aria-label="Dimas Arief Maryadi. Building better things, one commit at a time." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Dimas Arief Maryadi - Building better things, one commit at a time.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12081c"/><stop offset="1" stop-color="#2a1020"/></linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#ff6b3d"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <path id="leaf" d="M0,-9 L2.5,-4 L7,-6 L5,-1 L9,1 L3.5,3 L4,8 L0,5 L-4,8 L-3.5,3 L-9,1 L-5,-1 L-7,-6 L-2.5,-4 Z"/>
    <clipPath id="card"><rect x="10" y="10" width="1180" height="140" rx="14"/></clipPath>
  </defs>
  <rect x="10" y="10" width="1180" height="140" rx="14" fill="url(#bg)" stroke="url(#neon)" stroke-width="2"/>
  <g clip-path="url(#card)">
