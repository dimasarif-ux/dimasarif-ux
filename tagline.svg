    <g><animateTransform attributeName="transform" type="translate" from="872 -20" to="752 180" dur="11.0s" begin="-10.3s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="5.0s" repeatCount="indefinite"/><use xlink:href="#leaf" fill="#f2c14e" opacity="0.9" transform="scale(0.80)"/></g></g>
