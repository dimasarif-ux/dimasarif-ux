    <g><animateTransform attributeName="transform" type="translate" from="1216 -20" to="1096 180" dur="7.5s" begin="-1.9s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.7s" repeatCount="indefinite"/><use xlink:href="#leaf" fill="#f2c14e" opacity="0.9" transform="scale(0.65)"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" from="255 -20" to="135 180" dur="8.9s" begin="-6.8s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.4s" repeatCount="indefinite"/><use xlink:href="#leaf" fill="#c1352b" opacity="0.9" transform="scale(0.85)"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" from="177 -20" to="57 180" dur="11.4s" begin="-2.4s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="5.9s" repeatCount="indefinite"/><use xlink:href="#leaf" fill="#e8672b" opacity="0.9" transform="scale(0.50)"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" from="1221 -20" to="1101 180" dur="11.8s" begin="-6.4s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="4.9s" repeatCount="indefinite"/><use xlink:href="#leaf" fill="#f2c14e" opacity="0.9" transform="scale(0.62)"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" from="1317 -20" to="1197 180" dur="11.8s" begin="-10.6s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.1s" repeatCount="indefinite"/><use xlink:href="#leaf" fill="#f0a030" opacity="0.9" transform="scale(0.78)"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" from="232 -20" to="112 180" dur="7.3s" begin="-2.2s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4.8s" repeatCount="indefinite"/><use xlink:href="#leaf" fill="#9c2a2a" opacity="0.9" transform="scale(0.56)"/></g></g>
  </g>
  <g fill="none" stroke="#ffb347" stroke-width="3" stroke-linecap="round" filter="url(#glow)">
    <path d="M34 44 V34 H44"/><path d="M1166 44 V34 H1156"/><path d="M34 116 V126 H44"/><path d="M1166 116 V126 H1156"/>
  </g>
  <text x="600" y="48" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" letter-spacing="8" fill="#ffb98a" opacity="0.9">&gt; DIMAS ARIEF MARYADI</text>
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="700" text-anchor="middle" fill="url(#neon)" filter="url(#glow)">
    <text x="600" y="100" font-size="38" letter-spacing="3" opacity="0">HELLO, I'M DIMAS<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.27;0.33;1" dur="9s" begin="0s" repeatCount="indefinite"/></text>
    <text x="600" y="100" font-size="38" letter-spacing="3" opacity="0">INFORMATION SYSTEMS STUDENT<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.27;0.33;1" dur="9s" begin="3s" repeatCount="indefinite"/></text>
    <text x="600" y="100" font-size="38" letter-spacing="3" opacity="0">ONE COMMIT AT A TIME<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.27;0.33;1" dur="9s" begin="6s" repeatCount="indefinite"/></text>
  </g>
  <rect x="450" y="124" width="300" height="3" rx="1.5" fill="#3a1a2a"/>
  <rect x="450" y="124" width="0" height="3" rx="1.5" fill="url(#neon)" filter="url(#glow)"><animate attributeName="width" values="0;300;300;0" keyTimes="0;0.33;0.99;1" dur="3s" repeatCount="indefinite"/></rect>
